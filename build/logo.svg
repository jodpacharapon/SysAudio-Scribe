<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a97f0" />
      <stop offset="1" stop-color="#1c66c9" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- rounded-square app tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)" />
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sheen)" />

  <!-- bold S wordmark -->
  <text x="128" y="132" text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI', 'Arial', sans-serif" font-weight="800" font-size="176"
        fill="#ffffff">S</text>

  <!-- audio-wave accent tying the S to "SysAudio" -->
  <g stroke="#ffffff" stroke-opacity="0.9" stroke-width="7" stroke-linecap="round">
    <line x1="60" y1="200" x2="60" y2="212" />
    <line x1="80" y1="192" x2="80" y2="220" />
    <line x1="100" y1="184" x2="100" y2="228" />
    <line x1="156" y1="184" x2="156" y2="228" />
    <line x1="176" y1="192" x2="176" y2="220" />
    <line x1="196" y1="200" x2="196" y2="212" />
  </g>
</svg>
